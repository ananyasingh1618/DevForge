services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: devforge
      POSTGRES_DB: devforge
    ports:
      # Host port 5433 (not 5432): this machine already runs a native Postgres
      # service on 5432 for other, unrelated projects. Mapping to 5433 avoids
      # touching that service. Inside Docker's network, other containers still
      # reach this one at postgres:5432.
      - "5433:5432"
    volumes:
      - devforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devforge -d devforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Docker-internal hostname (the "postgres" service name), not the
      # host-mapped 5433 port used by local (non-Docker) `pnpm dev`.
      DATABASE_URL: postgresql://devforge:devforge@postgres:5432/devforge
      SESSION_SECRET: docker-compose-local-verification-secret-not-for-prod-0000
      FRONTEND_ORIGIN: http://localhost:4173
      # Docker-internal hostname for ai-service, analogous to postgres above.
      AI_SERVICE_URL: http://ai-service:8001
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Browser-facing URL (the browser runs on the host, not in the
        # Docker network), so this must be the host-mapped api port.
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-service:
    build:
      context: ai-service
    restart: unless-stopped
    environment:
      # Optional: passed through from the host shell's own environment if
      # set (e.g. `GEMINI_API_KEY=... docker compose up`). GEMINI_API_KEY is
      # preferred over ANTHROPIC_API_KEY whenever both are set — see
      # ai-service/app/lib/provider_config.py's resolve_llm_provider(). If
      # neither is set, this resolves to an empty string and ai-service
      # correctly serves /health while returning 503 PROVIDER_NOT_CONFIGURED
      # for every generate/analyze/answer/review request — the same honest
      # "not configured" behavior as local dev, never a fabricated result.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Same optional pass-through pattern as GEMINI_API_KEY above — kept as
      # a fully supported alternative provider, not a fallback that's
      # silently deprecated. Set this instead of (or in addition to, though
      # Gemini still wins) GEMINI_API_KEY to use Anthropic.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Same optional pass-through pattern as the two above, for Voyage AI
      # (embedding generation, Phase 8) — unrelated to which LLM text
      # provider is selected above. Unset -> a real 503
      # PROVIDER_NOT_CONFIGURED for /embeddings/generate, never a fabricated
      # vector.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  devforge_postgres_data:
